summary: >-
  XGuard's conformance profile is the agent-commerce protocol stack, declared IN THE CONTRACT rather than on a
  marketing page: x402 v2 (the domain standard for agent micropayments) is asserted by an x-payment-info
  extension on the one canonical operation, by x-xguard-payment-flow blocks on the compatible fetch tool, by a
  live HTTP 402 carrying a Payment-Required header with accepts[] {scheme exact, network eip155:8453, USDC
  asset, payTo} and by a payment manifest; the company is also itself an x402 facilitator (/supported, /verify,
  /settle). Around it sit MCP at protocol version 2026-07-28, an A2A 1.0.0 agent card, JSON-RPC 2.0 on both,
  CAIP-2 chain identifiers, EIP-3009 authorization binding for USDC, RFC 9116 security.txt, RFC 9728
  protected-resource metadata (served, and truthfully declaring no OAuth), ES256 JWS quotes and proofs keyed by
  did:web, OpenAPI 3.1.0 and JSON Schema 2020-12. It declares NO OAuth 2.0 / OIDC (by design - payment replaces
  accounts), no RFC 9457 problem details, no RFC 9727 api-catalog, no APIs.json and no RFC 8594 sunset
  signalling. Claims to "recognize" MPP, AP2, UCP, ACP and TAP appear on /v1/protocols and /docs and could not
  be verified against any published test vector, so they are recorded as claimed, not conformant.
standards:
- id: x402
  name: x402 HTTP payment protocol
  version: '2'
  conforms: true
  domain_standard_signature: true
  evidence: >-
    openapi/xguardgate-com-openapi.json POST /v1/execute (xguardExecute) declares x-payment-info {protocols:[{x402:{}}],
    price:{mode:dynamic, currency:USD, min:"0", max:"0.006000"}} and a 402 response with headers Payment-Required and
    X-XGuard-Quote; POST /v1/tools/web.fetch and /testnet declare x-xguard-payment-flow. Live probe 2026-09-19: POST
    /v1/execute {"intent":"Get a technology news digest","limit":3} returned HTTP 402 with header payment-required
    (base64url PaymentRequired object, x402Version 2, accepts[{scheme:exact, network:eip155:8453, asset:0x8335...2913,
    amount:"2000", payTo:0x4f32...ba07, maxTimeoutSeconds:300, extra.paymentFlow:upfront}], extensions {bazaar,
    payment-identifier, offer-receipt, xguard}) and the same object as the JSON body. /.well-known/payment-manifest
    declares protocol x402, x402_version 2, account_required false, subscription_required false. Nothing was paid.
  note: The market standard for agent-to-service micropayments; a caller that already speaks x402 v2 needs no bespoke connector. The same declaration appears on the Reconcile contract (openapi/xguardgate-com-reconcile-openapi.json x-payment-info, price $0.002, eip155:8453).
- id: x402-facilitator
  name: x402 facilitator API (supported / verify / settle)
  conforms: true
  evidence: 'GET https://api.xguardgate.com/supported 200 -> {kinds:[{x402Version, scheme, network}...], extensions, signers}; POST /verify and POST /settle declared in the OpenAPI with the x402 v2 envelope {x402Version, paymentPayload, paymentRequirements}; /.well-known/x402 (kind facilitator) and /healthz list four upstream facilitators the relay routes across (facilitator.payai.network, facilitator.xpay.sh, facilitator.openx402.ai, x402.dexter.cash).'
  verification: partial
  note: The discovery and supported-kinds surfaces were fetched; verify/settle were not exercised because they require a signed payment payload.
