- aid: xguardgate-com:xguard-a2a-agent
  name: XGuard A2A Agent
  description: >-
    Agent2Agent surface: an agent card served identically from https://api.xguardgate.com/.well-known/agent-card.json
    (the canonical location named in the provider's own xguard.json manifest) and from xguardgate.com, at both
    the A2A 1.0 path and the legacy /.well-known/agent.json path, as application/a2a+json. The card (version
    5.1.0) declares one JSONRPC interface at https://api.xguardgate.com/a2a with protocolVersion 1.0.0, four
    skills that mirror the four REST outcomes (extract-preview, web-extraction, product-offers, feed-digest),
    an x402 v2 paid-execution extension pointing at the payment manifest, and streaming, push notifications and
    extended card all false. The JSON-RPC endpoint answers a GET with the card itself plus a discovery block, and
    answers every other JSON-RPC method (tasks/get, agent/getAuthenticatedExtendedCard) with A2A error -32004
    Unsupported operation naming SendMessage as the only operation it implements.
  humanURL: https://xguardgate.com/developers
  baseURL: https://api.xguardgate.com/a2a
  tags:
  - A2A
  - agent-native
  - x402
  properties:
