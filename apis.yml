    url: https://api.xguardgate.com/.well-known/agent-card.json
- aid: xguardgate-com:xguard-reconcile-api
  name: XGuard Reconcile API
  description: >-
    A one-operation companion service at https://reconcile.xguardgate.com that resolves ambiguous x402 Base
    USDC settlements after a facilitator timeout: GET /v1/reconcile?from=0x...&nonce=0x... checks the EIP-3009
    authorization state and AuthorizationUsed logs and reports whether the nonce was consumed and, when
    observable, the settlement transaction hash. Published as OpenAPI 3.1.0 (info.title "XGuard Reconcile",
    version 1.2.0) with an x-payment-info extension declaring the price ($0.002 USDC, exact scheme, eip155:8453);
    the same terms appear in the host's /.well-known/x402.json discovery document and llms.txt. Non-custodial;
    never needs a private key.
  humanURL: https://reconcile.xguardgate.com/
  baseURL: https://reconcile.xguardgate.com
  tags:
  - x402
  - Payments
  - Reconciliation
  properties:
  - type: OpenAPI
