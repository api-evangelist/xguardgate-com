apis:
- aid: xguardgate-com:xguard-universal-paid-agent-api
  name: XGuard Universal Paid AI Agent + Secretless Gateway API
  description: >-
    The REST surface behind every XGuard product, published as OpenAPI 3.1.0 (info.version 5.1.0, 47 paths,
    49 operations, servers[] https://api.xguardgate.com) at https://api.xguardgate.com/openapi.json. The
    Outcomes group is the canonical product: POST /v1/execute (operationId xguardExecute) takes an intent
    plus up to three public URLs, returns a free result for intent:demo or supplied HTML, and otherwise
    answers HTTP 402 with a Payment-Required header, a signed five-minute X-XGuard-Quote and an exact USDC
    price; a funded x402 v2 client signs and retries the identical body, and GET /v1/results/{payment_identifier}
    recovers a paid outcome with the original quote. The contract also carries the x402 facilitator relay
    (/supported, /verify, /settle, /discovery/*), the compatible paid xguard.web.fetch tool with a Base
    Sepolia testnet twin, the Secretless Egress operator and agent endpoints under /v1/egress/*, the Action
    Rail permit/execute pair under /v1/actions/*, the free ATS-100 transaction-safety test, ProofRail proof
    verification and health/readiness probes. Only one operation declares an operationId and no
    securitySchemes are declared; credentials are documented as headers (X-XGuard-Key, Payment-Signature,
    X-XGuard-Quote, X-XGuard-Credit) and a scoped capability token instead.
  humanURL: https://xguardgate.com/developers
  baseURL: https://api.xguardgate.com
  tags:
  - Agents
  - x402
  - Web Extraction
  - Feed Aggregation
  - Credential Broker
  - Micropayments
