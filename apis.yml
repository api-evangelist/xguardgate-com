- aid: xguardgate-com:xguard-mcp-server
  name: XGuard MCP Server
  description: >-
    Remote Model Context Protocol server at https://api.xguardgate.com/mcp (Streamable HTTP, protocol version
    2026-07-28, serverInfo xguard-universal-paid-secretless-gateway 5.1.0). initialize and tools/list answer
    anonymously with three tools that carry real inputSchemas and annotations: xguard_discover (free catalog
    and prices), xguard_execute (the paid-outcome chokepoint; a paid call returns an isError tool result with
    the x402 PaymentRequired challenge in structuredContent and is retried with params._meta["x402/payment"])
    and xguard_get_result (recover a paid outcome by payment identifier and quote). Registered in the official
    MCP Registry as io.github.moelayyan90/xguard-control-plane; ready-to-paste Cursor, VS Code, Claude Code and
    Codex configurations are published at xguardgate.com/install/. No OAuth: RFC 9728 metadata at
    /.well-known/oauth-protected-resource/mcp states bearer_methods_supported is empty and that paid tools are
    gated by x402 payment rather than an account.
  humanURL: https://xguardgate.com/developers
  baseURL: https://api.xguardgate.com/mcp
