aid: xguardgate-com
name: XGuard
description: >-
  XGuard is a paid-tool and credential-brokering gateway for AI agents, operated from xguardgate.com with
  its API at api.xguardgate.com and its source published at github.com/moelayyan90/XGuard (Apache-2.0,
  Cloudflare Workers). Its canonical product, "XGuard Universal Paid AI Agent + Secretless Gateway" (v5.1.0),
  sells four public-source outcomes to any agent with no account or API key: a free HTML extraction preview,
  multi-page evidence extraction, Schema.org product-offer comparison and a deduplicated RSS/Atom feed digest,
  each priced per execution in USDC on Base (0.002-0.006 USDC) and settled through the x402 v2 protocol
  before the sources are touched, with a signed quote, a replay-safe payment identifier, a signed receipt
  and ES256 "ProofRail" execution evidence. A second surface, Secretless Egress, lets an operator store an
  upstream API credential (OpenAI, Anthropic, GitHub, Stripe, Slack, Notion, Cloudflare, Gemini or custom)
  and hand an agent a short-lived scoped capability instead of the secret, with a mandatory Idempotency-Key
  on every write. The same catalog is exposed as a 49-operation OpenAPI 3.1.0 contract, a remote Streamable
  HTTP MCP server at api.xguardgate.com/mcp that answers tools/list anonymously, an A2A 1.0.0 agent card at
  /.well-known/agent-card.json, an OpenAI plugin manifest, llms.txt and a set of x402 payment, egress and
  action manifests; a companion x402 settlement-reconciliation API runs at reconcile.xguardgate.com.
url: https://raw.githubusercontent.com/api-evangelist/xguardgate-com/refs/heads/main/apis.yml
