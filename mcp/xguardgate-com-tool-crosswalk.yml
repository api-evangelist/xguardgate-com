source: >-
  Derived by aligning the live MCP tools/list (mcp/xguardgate-com-mcp-tools.json, 3 tools, fetched anonymously
  2026-09-19) with the provider's OpenAPI 3.1.0 (openapi/xguardgate-com-openapi.json, 49 operations). The
  provider states the binding itself: the server card's execution_chokepoint names xguard_execute ->
  https://api.xguardgate.com/v1/execute, each capability page says "OpenAPI: xguardExecute · MCP: xguard_execute
  · A2A skill: <id>", and the llms.txt Recovery section maps xguard_get_result to GET /v1/results/{payment_identifier}.
purpose: >-
  Bind each MCP tool to the REST operation that backs it so the tool inherits a real request contract. Only ONE
  operation in the published OpenAPI carries an operationId (xguardExecute); the other 48 are addressed here by
  method + path, which is a contract-quality gap on the provider's side, not a mapping uncertainty.
surfaces:
  rest_openapi: openapi/xguardgate-com-openapi.json          # 49 operations, servers[] https://api.xguardgate.com; 1 operationId
  mcp: https://api.xguardgate.com/mcp                        # tools/list NOT gated; 3 tools with inputSchema
  a2a: https://api.xguardgate.com/a2a                        # 4 skills = the 4 capabilities behind xguard_execute
  graphql: null
crosswalk:
- tool: xguard_discover
  category: discovery
  rest: ['GET /v1/capabilities', 'GET /v1/pricing']
  binding: rest
  confidence: high
  note: Both operations are tagged Outcomes in the spec and neither declares an operationId; the tool's description ("outcomes, prices and examples") is the union of the two responses. Free.
- tool: xguard_execute
  category: execution
  rest: [xguardExecute]
  binding: rest
  confidence: high
  note: >-
    POST /v1/execute. The tool's inputSchema (intent, capability, url, urls, sources, action, desired_action,
    html, limit, max_age_seconds, query, testnet) is a subset of the operation's requestBody schema, which
    additionally accepts the tool-call wrapper fields input, arguments, name, tool, tool_id, toolId, function and
    type. The four capabilities selectable through it (extract-preview, web-extraction, product-offers,
    feed-digest) are the four A2A skills.
- tool: xguard_get_result
  category: recovery
  rest: ['GET /v1/results/{payment_identifier}']
  binding: rest
  confidence: high
  note: The operation requires header X-XGuard-Quote; the tool takes the same quote as an argument. Read-only; never re-executes or re-charges.
