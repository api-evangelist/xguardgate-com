- {method: POST, url: 'https://api.xguardgate.com/mcp', rpc: tools/list, http_status: 200, fetched: '2026-09-19', result: '3 tools with inputSchema and annotations (saved verbatim to mcp/xguardgate-com-mcp-tools.json)'}
- {method: GET, url: 'https://api.xguardgate.com/.well-known/mcp/server-card.json', http_status: 200, fetched: '2026-09-19', result: 'server card naming endpoint, transport streamable-http, authentication {required:false, schemes:[]}, the same 3 tools and 4 capabilities with input/output schemas (saved verbatim)'}
- {method: GET, url: 'https://api.xguardgate.com/.well-known/oauth-protected-resource/mcp', http_status: 200, fetched: '2026-09-19', result: 'resource https://api.xguardgate.com/mcp, bearer_methods_supported [], oauth_supported false'}
tool_count: 3
tools:
- name: xguard_discover
  category: discovery
  description: Inspect executable outcomes, prices and examples. Free; no setup.
  input: no parameters (additionalProperties false)
  annotations: {readOnlyHint: true, openWorldHint: false}
  rest: GET /v1/capabilities, GET /v1/pricing
- name: xguard_execute
  category: execution
  description: >-
    Extract multi-page evidence, compare structured product offers, or merge feeds. intent:'demo' is free.
    Paid work returns an x402 PaymentRequired tool result; a funded x402 MCP client authorizes and retries with
    params._meta['x402/payment'], preserving the signed quote.
  input: intent (string|object), capability (enum extract-preview|web-extraction|product-offers|feed-digest), url, urls[<=3], sources[<=3], action, desired_action, html (<=12288 chars), limit (1-30), max_age_seconds (0-60), query, testnet
  annotations: {readOnlyHint: false, destructiveHint: false, idempotentHint: false, openWorldHint: true}
  rest: POST /v1/execute (operationId xguardExecute)
- name: xguard_get_result
  category: recovery
  description: Recover a paid outcome using its payment identifier and original signed quote; never charges or executes again. The quote is a bearer recovery credential.
  input: payment_identifier, quote
  annotations: {readOnlyHint: true, openWorldHint: false}
  rest: GET /v1/results/{payment_identifier} with header X-XGuard-Quote
payment:
  protocol: x402 v2
  network: eip155:8453 (Base mainnet); Base Sepolia via testnet:true
  asset: USDC 0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913
  challenge: isError tool result carrying PaymentRequired in structuredContent and content[0].text
  retry: identical arguments plus params._meta["x402/payment"]
  settlement: result._meta["x402/payment-response"]
  official_client: '@x402/mcp (https://docs.cdp.coinbase.com/x402/buyer/mcp-payments), as linked from xguardgate.com/developers'
crosswalk: mcp/xguardgate-com-tool-crosswalk.yml
