summary: >-
  XGuard operates ONE remote MCP server at https://api.xguardgate.com/mcp, on the same host as its OpenAPI,
  its A2A JSON-RPC endpoint and its x402 facilitator relay. It is Streamable HTTP, speaks MCP protocol version
  2026-07-28, identifies itself as serverInfo {xguard-universal-paid-secretless-gateway, 5.1.0}, and answers
  initialize and tools/list anonymously with exactly three tools, each carrying a real JSON Schema inputSchema
  and MCP tool annotations (readOnlyHint / destructiveHint / idempotentHint / openWorldHint). The initialize
  instructions and the provider's README both say the live tools/list is deliberately small: the paid-outcome
  chokepoint is xguard_execute, and the older explicit tool names that llms-install.md still lists
  (xguard.web.fetch, xguard_secretless_egress, xguard_proofrail, ...) are "compatibility references, not the
  default catalog". A paid tool call returns an HTTP 200 JSON-RPC result with isError: true and the x402
  PaymentRequired challenge in both structuredContent and content[0].text; a funded x402 MCP client retries the
  identical arguments with params._meta["x402/payment"] and receives settlement in
  result._meta["x402/payment-response"]. Authorship is not in question: the tool names, the serverInfo name,
  the canonical-identity block in every response header set (x-xguard-canonical-mcp) and the MCP Registry
  entry io.github.moelayyan90/xguard-control-plane all name this provider.
server:
  name: xguard-universal-paid-secretless-gateway
  title: XGuard Universal Paid AI Agent + Secretless Gateway
  version: 5.1.0
  transport: streamable-http
  url: https://api.xguardgate.com/mcp
  protocol_version: '2026-07-28'
  capabilities:
    tools: {listChanged: false}
    resources: {subscribe: false, listChanged: false}
    prompts: {listChanged: false}
  registry:
    name: io.github.moelayyan90/xguard-control-plane
    manifest: https://github.com/moelayyan90/XGuard/blob/main/server.json
    schema: https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json
    note: server.json in the repository says version 5.1.1 while the live server, the OpenAPI, the agent card and every x-xguard-version response header say 5.1.0 on 2026-09-19.
  server_card: mcp/xguardgate-com-mcp-server-card.json
  server_card_source: https://api.xguardgate.com/.well-known/mcp/server-card.json
  tools_list: mcp/xguardgate-com-mcp-tools.json
  listings:
  - Official MCP Registry (server.json, io.github.moelayyan90/xguard-control-plane)
  - glama.json maintainer manifest in the repository
  - agent-plugins.org mcp.json / plugin.json manifests in the repository
deployment:
  mode: remote
  endpoint: https://api.xguardgate.com/mcp
  auth: none
  verified: probed
  install_configs:
  - client: Claude Code
    url: https://xguardgate.com/install/claude-code.json
    config: '{"mcpServers":{"xguard":{"type":"http","url":"https://api.xguardgate.com/mcp"}}}'
  - client: Cursor
    url: https://xguardgate.com/install/cursor.json
    config: '{"mcpServers":{"xguard":{"url":"https://api.xguardgate.com/mcp"}}}'
  - client: VS Code
    url: https://xguardgate.com/install/vscode.json
    config: '{"servers":{"xguard":{"type":"http","url":"https://api.xguardgate.com/mcp"}}}'
  - client: Codex
    url: https://xguardgate.com/install/codex.toml
    config: '[mcp_servers.xguard]\nurl = "https://api.xguardgate.com/mcp"'
  note: >-
    A hosted HTTPS endpoint an MCP client POSTs to directly; llms-install.md says "Do not clone, build, or run a
    local process merely to connect it" and no stdio package or npx/uvx install is documented. auth is "none" in
    the connection sense: initialize and tools/list need no credential, the RFC 9728 document at
    /.well-known/oauth-protected-resource/mcp declares bearer_methods_supported [] and oauth_supported false,
    and /.well-known/oauth-authorization-server returns a deliberate 404 ("XGuard does not advertise a
    fictitious OAuth issuer"). Paid tool calls are gated by x402 PAYMENT (USDC on Base, eip155:8453), not by an
    account; installing the server supplies no wallet.
