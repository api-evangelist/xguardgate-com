payment_flow:
  protocol: x402 v2
  steps:
  - 'POST the request without payment; receive 402 + Payment-Required + X-XGuard-Quote (five-minute ES256 quote bound to the input digest, price, asset, network, recipient and payment identifier)'
  - 'Sign Payment-Required with an x402 v2 client (Base USDC EIP-3009 authorization)'
  - 'Retry the IDENTICAL body with Payment-Signature and the preserved X-XGuard-Quote; "settlement_before_execution" - XGuard verifies and settles, then fetches'
  - 'Read Payment-Response, x-xguard-receipt and x-xguard-proof; keep the payment identifier + quote as the recovery credential for GET /v1/results/{payment_identifier}'
  rule: 'Never sign a second payment to resolve an uncertain response - recover with getResult instead (SDK README; the SDK enforces a default budget of zero).'
