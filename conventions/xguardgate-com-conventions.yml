base_url: https://api.xguardgate.com
api_style: REST over HTTPS with JSON bodies; one intent-shaped POST for the product, plus JSON-RPC 2.0 twins on /mcp and /a2a
media_type: application/json (errors too; 402 challenges also travel base64url in the Payment-Required header)
auth:
  style: >-
    No accounts on the public path. Discovery, the free preview and price quotes are anonymous. A paid outcome is
    authorised by PAYMENT: the first request returns 402 with a signed quote (X-XGuard-Quote) and an x402 v2
    Payment-Required challenge; the retry carries Payment-Signature. Operator management endpoints
    (/v1/egress/credentials, /v1/egress/capabilities, /v1/actions/permits) take an X-XGuard-Key header; an
    agent executing a delegated action presents a short-lived scoped capability (xgc_...) in the request body,
    never the upstream secret. Recovery of a paid result uses the original quote as a bearer credential. The
    OpenAPI declares NO securitySchemes; all of this is documented as header parameters and prose.
  detail: authentication/xguardgate-com-authentication.yml
idempotency:
  supported: true
  coverage: partial
  mechanism: Two mechanisms - an Idempotency-Key header (or idempotency_key body field) on delegated egress writes, and a durable payment identifier + signed quote on paid outcomes; Action Rail permits are single-use and inject an Idempotency-Key automatically.
  header: Idempotency-Key
  scope:
  - 'POST /v1/egress/fetch - Idempotency-Key REQUIRED for POST/PUT/PATCH/DELETE upstream methods (400 before billing without it); GET/HEAD need an explicit key to gain replay protection'
  - 'POST /v1/execute (xguardExecute) - replay by payment identifier + original X-XGuard-Quote: "Identical paid retries return stored results" (public-gateway-contract.md); an unsigned first call is itself idempotent because it only quotes'
  - 'POST /v1/tools/web.fetch and /testnet - same payment-identifier replay; 409 "Replay or idempotency conflict"'
  - 'POST /v1/actions/execute - single-use signed permit bound to the exact request; "automatic Idempotency-Key injection"; 409 "Replay, state or binding conflict"'
  - 'POST /settle - durable settlement receipts act as the replay guard'
  not_covered:
  - 'POST /v1/egress/credentials and POST /v1/egress/capabilities (resource creation) - no idempotency key documented'
  - 'POST /edge/{merchant-host}/{path} - billing is "only successful transaction calls" but no replay key is documented for the proxied request itself'
  key_format: '8-128 ASCII letters, digits, underscores, colons, periods or hyphens (docs/secretless-outcomes.md); a stable BUSINESS key, e.g. support-case-123-v1'
  retention: 'Egress: replay while the capability is valid (30-3600 s lifetime); encrypted results deleted 24 hours after capability expiry. Paid outcomes: read-only recovery accepts the original quote after its execution expiry.'
  conflict_behavior: >-
    Same key + identical request -> stored status, body and proof with X-XGuard-Replay: true, no new charge or
    upstream request. Same key + changed URL/query/method/headers/body -> 409 idempotency_request_conflict.
    Concurrent duplicate -> 409 execution_in_progress (poll with the same key). Reserved attempt with unknown
    outcome -> 409 execution_outcome_unknown, never re-executed automatically. The provider's explicit rule:
    "Never generate a new key automatically to escape an ambiguous outcome."
  guarantee: 'At most one XGuard upstream attempt per capability and key - "not a universal distributed exactly-once guarantee"; if the upstream acted but its response was lost, XGuard cannot prove completion.'
  docs: https://github.com/moelayyan90/XGuard/blob/main/docs/secretless-outcomes.md
