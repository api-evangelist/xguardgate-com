  detail: sandbox/xguardgate-com-sandbox.yml
reversibility:
  grade: documented
  docs: https://xguardgate.com/refund-policy
  note: >-
    Reversal paths exist for every write class and are documented, but no reversal WINDOW is stated for any of
    them, so the grade is documented (0.4), not verified. A settled paid outcome cannot be un-executed; what the
    provider offers is a signed execution credit when all sources fail, an explicit "not an automatic cash
    refund", a revoke operation for delegated capabilities, and a credits-based refund policy for operator
    purchases whose timing is "subject to the checkout provider". Nothing below asserts a window the provider
    has not written down.
  write_surfaces:
  - operation: xguardExecute (paid outcome, x402)
    action: Settle USDC and fetch public sources
    reversal: execution credit on total source failure; no refund otherwise
    reversal_operation: 'retry xguardExecute with X-XGuard-Credit + the original X-XGuard-Quote'
    window: null
    stated_terms:
    - source: https://xguardgate.com/pricing
      verbatim: 'If all sources fail after settlement, the response provides an execution credit for the same outcome. This is not an automatic cash refund. Keep the original recovery data.'
    - source: https://github.com/moelayyan90/XGuard/blob/main/README.md
      verbatim: 'Retry with X-XGuard-Credit and the signed quote; no second payment is required. Credit fulfillment is stored and recoverable using the original quote. A credit is not an automatic cash refund.'
  - operation: 'POST /v1/egress/capabilities (issue a scoped capability)'
    action: Grant an agent time-boxed delegated access to an operator credential
    reversal: revoke
    reversal_operation: 'DELETE /v1/egress/capabilities/{id} with X-XGuard-Key'
    window: null
    stated_terms:
    - source: openapi/xguardgate-com-openapi.json
      verbatim: 'Revoke a capability; already dispatched work may finish'
    - source: https://github.com/moelayyan90/XGuard/blob/main/docs/secretless-outcomes.md
      verbatim: 'Revoked or expired capability: Stored-result access and new attempts are denied; already authorized in-flight work may finish'
    note: Capabilities also expire on their own (ttl_seconds 30-3600), which bounds exposure but is a lifetime, not a reversal window.
  - operation: 'POST /v1/egress/fetch (delegated upstream write)'
    action: Perform one credential-backed upstream call, billed in Usage Credits
    reversal: none at XGuard; the upstream vendor's own semantics apply
    reversal_operation: null
    window: null
    stated_terms:
    - source: https://github.com/moelayyan90/XGuard/blob/main/docs/secretless-outcomes.md
      verbatim: 'Transport timeout, blocked reflected secret, or oversized response after billing: Stored ambiguous result; no automatic reexecution or cash refund'
    - source: https://api.xguardgate.com/v1/egress/pricing
      verbatim: 'upstream_failure_after_billing: the egress attempt remains billed; XGuard never auto-replays an ambiguous attempt'
  - operation: Operator Usage Credits purchase (Lemon Squeezy checkout, not an API operation)
    action: Buy 5,000 credits (JOD 3.550)
    reversal: provider-confirmed refund reconciled against credits
    reversal_operation: 'email support with the order identifier'
    window: null
    stated_terms:
    - source: https://xguardgate.com/refund-policy
      verbatim: 'A provider-confirmed refund removes the proportional Usage Credits from the associated order. If those credits were already consumed, the account records refund debt and becomes restricted rather than silently creating a negative or inconsistent balance.'
    - source: https://xguardgate.com/refund-policy
      verbatim: 'Eligibility and payment return timing are subject to the checkout provider and applicable requirements.'
  - operation: 'POST /v1/actions/permits -> POST /v1/actions/execute'
    action: Execute a mandate-bound external action
    reversal: permits expire and can be revoked ("expiry and revocation" in the controls list); the executed action itself is not reversed by XGuard
    reversal_operation: null
    window: null
    stated_terms:
    - source: https://api.xguardgate.com/.well-known/xguard-actions.json
      verbatim: 'controls: ... "single-use execution", "replay rejection", "expiry and revocation", "fail-closed ambiguous state", "durable execution receipt"'
    note: No revoke endpoint for permits appears in the OpenAPI; the manifest names the control but not the operation.
