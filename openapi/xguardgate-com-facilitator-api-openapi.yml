openapi: 3.2.0
info:
  title: XGuard Universal Paid AI Agent + Secretless Gateway…
  version: 5.1.0
  description: Describe a supported outcome. Receive normalized results or an exact x402 price, then authorize and retry the same request. Start with intent:demo for free.
servers:
- url: https://api.xguardgate.com
tags:
- name: Facilitator
paths:
  /facilitator:
    get:
      summary: Machine-readable XGuard facilitator identity and routing capabilities
      responses:
        '200':
          description: Facilitator metadata
      tags:
      - Facilitator
      operationId: getFacilitator
      x-operation-id-source: derived
  /v1/facilitator/route:
    get:
      summary: Inspect the route XGuard would select for a network/scheme
      responses:
        '200':
          description: Live compatible route recommendation
        '503':
          description: No compatible live route
      tags:
      - Facilitator
      operationId: getV1FacilitatorRoute
      x-operation-id-source: derived
