openapi: 3.2.0
info:
  title: XGuard Universal Paid AI Agent + Secretless Gateway Pricing…
  version: 5.1.0
  description: Describe a supported outcome. Receive normalized results or an exact x402 price, then authorize and retry the same request. Start with intent:demo for free.
servers:
- url: https://api.xguardgate.com
tags:
- name: Pricing
paths:
  /v1/pricing/quote:
    post:
      summary: Quote a live outcome or the compatible web.fetch tool
      description: Free. Send capability:feed-digest for the smallest paid-outcome quote. Tool aliases and JSON-encoded function arguments are accepted only when unambiguous. Quantity is one bounded execution. next.body is directly executable with the returned quote header. Testnet must match the requested network.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
              - type: object
                properties:
                  intent:
                    oneOf:
                    - type: string
                      maxLength: 3000
                    - type: object
                  capability:
                    type: string
                    enum:
                    - extract-preview
                    - web-extraction
                    - product-offers
                    - feed-digest
                  url:
                    type: string
                    format: uri
                  urls:
                    type: array
                    maxItems: 3
                    items:
                      type: string
                      format: uri
                  sources:
                    type: array
                    maxItems: 3
                    items:
                      oneOf:
                      - type: string
                        format: uri
                        pattern: ^https://
                      - type: object
                        required:
                        - url
                        properties:
                          url:
                            type: string
                            format: uri
                          fallbacks:
                            type: array
                            maxItems: 1
                            items:
                              type: string
                              format: uri
                        additionalProperties: false
                  action:
                    type: string
                  desired_action:
                    type: string
                  html:
                    type: string
                    maxLength: 12288
                  limit:
                    type: integer
                    minimum: 1
                    maximum: 30
                  max_age_seconds:
                    type: integer
                    minimum: 0
                    maximum: 60
                    default: 0
                  query:
                    type: string
                    maxLength: 200
                  testnet:
                    type: boolean
                    default: false
                  input:
                    type: object
                  arguments:
                    oneOf:
                    - type: object
                    - type: string
                      description: JSON-encoded object, as used by tool calls
                  name:
                    type: string
                  tool:
                    type: string
                  tool_id:
                    type: string
                  toolId:
                    type: string
                  function:
                    type: object
                    required:
                    - name
                    - arguments
                    properties:
                      name:
                        type: string
                      arguments:
                        type:
                        - string
                        - object
                    additionalProperties: false
                  type:
                    const: function
                  quantity:
                    const: 1
                  units:
                    const: 1
                  requests:
                    const: 1
                  calls:
                    const: 1
                  network:
                    type: string
                    enum:
                    - eip155:8453
                    - eip155:84532
                    - base
                    - base-sepolia
                  operation:
                    type: object
                    description: Resolved read-only OpenAPI operation with URL, method and desired action; no remote spec fetching.
                  http:
                    type: object
                  command:
                    type: string
                  task:
                    type: object
                additionalProperties: false
                description: Use intent:'demo' for a free result. Paid outcomes accept supported English/Arabic intents with public sources. Unknown jobs return repair guidance; this is not a general-purpose language model.
