openapi: 3.2.0
info:
  title: XGuard Reconcile API
  version: 1.2.0
  description: Resolve ambiguous x402 Base USDC settlements after facilitator timeouts.
servers:
- url: https://reconcile.xguardgate.com
tags:
- name: Reconcile
paths:
  /v1/reconcile:
    get:
      summary: Reconcile an ambiguous x402 settlement
      description: Checks Base USDC EIP-3009 authorization state and recent AuthorizationUsed logs.
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          pattern: ^0x[0-9a-fA-F]{40}$
      - name: nonce
        in: query
        required: true
        schema:
          type: string
          pattern: ^0x[0-9a-fA-F]{64}$
      responses:
        '200':
          description: Paid reconciliation result
        '400':
          description: Invalid query parameters
        '402':
          description: x402 payment required
        '503':
          description: Base RPC unavailable
      x-payment-info:
        protocol: x402
        version: 2
        scheme: exact
        network: eip155:8453
        price: $0.002
        asset: USDC
        resource: https://reconcile.xguardgate.com/v1/reconcile
      tags:
      - Reconcile
      operationId: getV1Reconcile
      x-operation-id-source: derived
