  note: 'Served and truthful: they document that there is no OAuth. /.well-known/oauth-authorization-server returns a deliberate 404 ("XGuard does not advertise a fictitious OAuth issuer").'
spec_gaps:
- No components.securitySchemes and no security requirements in the OpenAPI, so a generated client cannot know which operations need X-XGuard-Key or a capability without reading the prose; proposed schemes are in overlays/xguardgate-com-openapi-overlay.yaml.
- 401 responses carry no WWW-Authenticate header.
key_hygiene:
- 'Never enter a wallet private key into the site or an AI conversation (developers page); XGUARD_PAYER_PRIVATE_KEY stays in the local process environment.'
- 'Do not place an operator key in an AI prompt (pricing/operator page).'
- 'Agents receive capabilities, never upstream secrets; the response filter blocks literal, encoded and base64 credential reflections (docs/secretless-outcomes.md).'
