description: >-
  XGuard publishes no CHANGELOG file and no /changelog page (404 on xguardgate.com); the dated record is the
  GitHub Releases feed of the single public repository moelayyan90/XGuard (created 2026-08-14, JavaScript,
  Apache-2.0, 207 files, last push 2026-09-19). Releases are tagged per component - the x402 SDK carries the
  product version (5.1.0), while browser-side and packaging artifacts have their own series. The live API
  additionally exposes its deployed build in every response (x-xguard-version 5.1.0, x-xguard-worker-version-tag
  git-2a546589e186), and the repository's docs/settlement-context.md maps a Worker version id to a commit, so a
  consumer can tie a response to source. Product-level change notes live in the README ("New quotes explicitly
  declare extra.paymentFlow: upfront; outstanding older quotes retain their original terms") and in
  DISTRIBUTION.md's dated status sections (e.g. "PAID-AGENT DISCOVERY STATUS (2026-09-14)").
