problem_types:
- status: 400
  title: Request rejected with repair instructions
  occurrences: 7
  operations: [xguardExecute, 'POST /verify', 'POST /settle', 'POST /v1/test', 'POST /v1/preflight', 'POST /v1/pricing/quote', 'POST /v1/proofs/verify']
  causes:
  - Malformed or contradictory input (intent, source, quantity, network or tool fields that conflict are rejected rather than resolved by precedence).
  - Payment firewall block on /verify and /settle (missing_payment_context when paymentPayload or paymentRequirements is absent; requirement/accepted binding mismatch; recipient, value, nonce or validity-window mismatch).
  - Secretless Egress write (POST/PUT/PATCH/DELETE) without an idempotency key, rejected before billing.
  remediation: Read error.code and repair.suggested_request; resend the corrected request. retryable is false.
- status: 401
  title: Credential required
  occurrences: 3
  codes: [xguard_key_required, missing_xguard_license, capability_required]
  operations: ['POST /v1/egress/credentials', 'POST /v1/actions/permits', 'POST /v1/egress/fetch']
  remediation: Operator endpoints need X-XGuard-Key; agent egress needs a valid scoped capability. No WWW-Authenticate challenge is sent.
- status: 402
  title: Payment or Usage Credits required
  occurrences: 8
  operations: [xguardExecute, 'POST /settle', 'POST /edge/{merchant-host}/{path}', 'POST /v1/actions/permits', 'POST /v1/actions/execute', 'POST /v1/egress/fetch', 'POST /v1/tools/web.fetch', 'POST /v1/tools/web.fetch/testnet']
  shape: x402 v2 PaymentRequired object (not the PublicError envelope) on the public paid path; Usage Credits exhaustion on operator paths.
  remediation: Sign Payment-Required with an x402 v2 client and retry the IDENTICAL body with Payment-Signature, preserving X-XGuard-Quote; the quote expires in 300 seconds. Operator paths need prepaid Usage Credits.
- status: 403
  title: Unsafe target, scope denied or recovery credential rejected
  occurrences: 7
  operations: [xguardExecute, 'GET /v1/results/{payment_identifier}', 'POST /edge/{merchant-host}/{path}', 'DELETE /v1/egress/capabilities/{id}', 'POST /v1/egress/fetch', 'POST /v1/preflight', 'POST /v1/pricing/quote']
  causes:
  - Private, local, cloud-metadata, credential-bearing or XGuard-owned target URL (SSRF policy).
  - Merchant hostname has not published the _xguard.<host> TXT "xguard-edge=enabled" record.
  - Caller is not the capability owner, or the capability/credential scope (host, path prefix, method) denies the request.
  - Wrong X-XGuard-Quote presented as the recovery credential.
- status: 404
  title: Not found / unknown identifier
  occurrences: 4
  operations: ['GET /v1/receipts/{receipt_id}', 'GET /v1/operations/{payment_identifier}', 'GET /v1/capabilities/{id}', 'GET /v1/results/{payment_identifier}']
  note: GET /v1/capabilities/{id} returns "Unavailable with alternatives" - a 404 that lists the capabilities that do exist.
- status: 409
  title: Replay, idempotency, state or binding conflict
  occurrences: 5
  codes: [idempotency_request_conflict, execution_in_progress, execution_outcome_unknown]
  operations: [xguardExecute, 'POST /settle', 'POST /v1/actions/execute', 'POST /v1/egress/fetch', 'POST /v1/tools/web.fetch']
  causes:
  - Same Idempotency-Key with a changed URL, query, method, headers or serialized body (idempotency_request_conflict).
  - A concurrent copy while the first attempt is active (execution_in_progress; poll with the same key).
  - A reserved attempt whose outcome is unknown (execution_outcome_unknown; never re-executed automatically).
  - Single-use action permit replayed, or x402 payment replayed against the durable receipt store.
  remediation: Do NOT rotate the key to escape an ambiguous outcome; recover with the same key / payment identifier. This is the provider's explicit instruction.
- status: 413
  title: Payload too large
  occurrences: 4
  operations: [xguardExecute, 'POST /verify', 'POST /settle', 'POST /v1/pricing/quote']
  limits: 'html <= 12,288 chars; request bodies <= 1 MiB (edge and egress); buffered upstream results <= 48 KiB.'
- status: 422
  title: Unprocessable - no capability matches, or hostname has no public DNS address
  occurrences: 3
  codes: [capability_unavailable]
  operations: [xguardExecute, 'POST /v1/preflight', 'POST /v1/pricing/quote']
  remediation: The body is self-describing - repair.suggested_request and closest_capabilities[] name a request that will work.
- status: 428
  title: Scoped mandate required
  occurrences: 1
  operations: ['POST /v1/actions/permits']
  remediation: Create a mandate (POST /v1/mandates per /docs) before requesting an action permit.
- status: 429
  title: Rate limit
  occurrences: 4
  operations: [xguardExecute, 'POST /verify', 'POST /settle', 'POST /v1/pricing/quote']
  note: Declared in the contract with no limit number and no Retry-After / RateLimit-* header documented; see rate-limits/xguardgate-com-rate-limits.yml.
- status: 500
  title: Internal error with repair instructions
  occurrences: 2
  operations: [xguardExecute, 'POST /v1/pricing/quote']
- status: 502
  title: No usable source; execution credit retained
  occurrences: 1
  operations: [xguardExecute]
  remediation: When every source (and fallback) fails after settlement, the response carries a signed execution credit; retry the same outcome with X-XGuard-Credit and the original quote. Not a cash refund.
- status: 503
  title: Payment unavailable, settlement awaiting reconciliation, or ambiguous outcome (fail closed)
  occurrences: 10
  operations: [xguardExecute, 'POST /verify', 'POST /settle', 'GET /v1/facilitator/route', 'POST /v1/actions/execute', 'POST /v1/egress/fetch', 'GET /v1/ready', 'POST /v1/preflight', 'POST /v1/pricing/quote', 'POST /v1/tools/web.fetch']
  remediation: Retryable on the free paths (quote, preflight, route). On paid or delegated paths XGuard never auto-replays an ambiguous settlement or upstream call; poll GET /v1/operations/{payment_identifier} or the same idempotency key, and for Base USDC timeouts use the reconcile service.
- status: 308
  title: Canonical discovery alias
  occurrences: 3
  operations: ['GET /agent-card.json', 'GET /openapi.yaml', 'GET /pricing']
  note: Not errors - permanent redirects to the canonical documents.
