format: json-error-envelope
summary: >-
  XGuard uses ONE envelope for every REST failure, declared once as components.schemas.PublicError and
  documented in docs/public-gateway-contract.md: ok:false, error{code,message,retryable,docs,...}, error_code,
  request_id and a next{} object that tells the caller what to do. The request id in the body matches the
  x-xguard-request-id response header. Repair-shaped errors add repair.suggested_request (a body the caller can
  send instead), closest_capabilities and example. HTTP 402 is NOT an error in this envelope: it is the native
  x402 v2 PaymentRequired object (status, price, accepts[], resource, extensions) with additive xguard_error
  guidance, carried with Payment-Required and X-XGuard-Quote headers. Not RFC 9457: no type URI, title, status
  or instance member, and the media type is application/json. The JSON-RPC surfaces (/mcp, /a2a) use JSON-RPC
  2.0 error objects instead. Every unknown path on xguardgate.com, www and api.xguardgate.com returns this
  same envelope with code not_found (374 bytes), never an HTML shell; reconcile.xguardgate.com returns a
  13-byte text/plain "404 Not Found".
envelope:
  media_type: application/json
  schema: openapi/xguardgate-com-openapi.json#/components/schemas/PublicError
  required: [ok, error, error_code, request_id, next]
  fields:
  - {name: ok, type: 'const false'}
  - {name: error.code, type: string, description: 'Stable machine code (snake_case). Consumers should read error.code or error_code, not the message.'}
  - {name: error.message, type: string}
  - {name: error.retryable, type: boolean, description: 'Whether an identical retry may succeed.'}
  - {name: error.docs, type: uri, description: 'Always https://api.xguardgate.com/openapi.json in observed responses.'}
  - {name: error.field, type: string, optional: true}
  - {name: error.required_fields, type: 'string[]', optional: true}
  - {name: error.example, type: object, optional: true, description: 'A request that would have worked.'}
  - {name: error_code, type: string, description: 'Duplicate of error.code at the top level.'}
  - {name: request_id, type: string, description: 'xgr_<32 hex>; equals the x-xguard-request-id response header.'}
  - {name: next, type: object, description: 'Machine next step: {method, path, action, payment_required}.'}
  - {name: repair, type: object, optional: true, description: '{missing[], suggested_request} on validation and intent failures.'}
  - {name: closest_capabilities, type: 'object[]', optional: true}
  headers:
  - {name: x-xguard-request-id, description: 'Request id, also in the body.'}
  - {name: Payment-Required, on: 402, description: 'Base64url x402 v2 PaymentRequired object.'}
  - {name: X-XGuard-Quote, on: 402, description: 'Signed ES256 quote (kid did:web:api.xguardgate.com#xguard-proofrail); preserve on the paid retry.'}
  - {name: Link, on: 402, description: 'rel="pricing" -> /v1/pricing/quote; rel="verification-key" -> /.well-known/xguard-proof-key.json'}
