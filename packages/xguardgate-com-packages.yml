summary: >-
  XGuard ships one first-party client library - the JavaScript "xguard-x402-control-plane" SDK (sdk/index.js
  facilitator helpers + sdk/outcomes.js paid-outcome client) - and it is deliberately NOT on npm: sdk/README.md
  says "no npm publication is claimed. Install the tested GitHub revision", and registry.npmjs.org returns 404
  for xguard-x402-control-plane, @xguard/edge, @xguard/sdk, @xguard/core, xguard and xguardgate. Distribution is
  a GitHub Release tarball (xguard-x402-control-plane-5.1.0.tgz + SHA256SUMS.txt, 2026-09-01) built by the
  release-x402-sdk workflow, or a git clone as the developers page instructs. Python, Go, Cloudflare Worker and
  WordPress code exist in integrations/ but as single-file examples/connectors rather than packaged libraries;
  an "xguard CLI" appears only in the 0.1.0-alpha packaging bundle of 2026-08-18 and nowhere in the current
  tree, so no cli/ artifact is emitted. The name collisions on public registries (PyPI "xguard" 0.0.2, a
  guard-clause library by johngitahi; npm "koa-xguard") are NOT this provider.
