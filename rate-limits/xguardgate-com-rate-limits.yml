limit_count: 0
summary: >-
  XGuard publishes NO request-rate limits. The OpenAPI declares a 429 response on four operations (POST
  /v1/execute "Rate limit", POST /verify, POST /settle, POST /v1/pricing/quote) with no number, no window and no
  response headers; the developers page, README and contract docs never state a requests-per-second or per-day
  ceiling; and none of the live responses observed on 2026-09-19 (200, 204, 402, 404, 422) carried a
  RateLimit-*, X-RateLimit-* or Retry-After header. What the provider does publish are per-request BOUNDS and
  per-capability BUDGETS - input sizes, source counts, timeouts, quote lifetimes, capability call caps - which
  are recorded below as bounds because they are not rate limits and must not be counted as one. An honest zero.
rate_limits: []
exhaustion_signal:
  status: 429
  declared_on: [xguardExecute, 'POST /verify', 'POST /settle', 'POST /v1/pricing/quote']
  headers_documented: []
  headers_observed: []
  body: 'PublicError envelope (ok:false, error.code, error.retryable, request_id, next) - the 429 description on /verify, /settle and /quote is the generic "Request rejected with repair instructions; no automatic retry of ambiguous settlement."'
  note: 'The x402 facilitator discovery document describes the relay as failing over "explicit rate-limit rejection" from upstream facilitators, so a 429 on /verify or /settle may originate upstream.'
