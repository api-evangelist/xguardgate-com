overlay: 1.0.0
info:
  title: API Evangelist enhancements for the XGuard Universal Paid AI Agent + Secretless Gateway API
  version: '2026-09-19'
extends: https://api.xguardgate.com/openapi.json
x-apievangelist:
  generated: '2026-09-19'
  method: generated
  source: openapi/xguardgate-com-openapi.json (verbatim copy of https://api.xguardgate.com/openapi.json, fetched
    2026-09-19)
  description: 'Non-destructive enhancements layered over the provider-hosted spec: proposed operationIds for the
    48 operations that declare none (deterministic method+path names; only xguardExecute is provider-declared),
    a tag per capability group for the 44 untagged operations, four securitySchemes for the header credentials the
    spec documents as parameters and text (X-XGuard-Key, Payment-Signature, X-XGuard-Quote, X-XGuard-Credit) applied
    only where the spec states the credential is required, and info.contact/termsOfService/externalDocs from the
    published site. Nothing here changes a path, parameter or response; the original openapi/ file is untouched.'
actions:
- target: $.info
  update:
    termsOfService: https://xguardgate.com/terms
    contact:
      name: XGuard security and support contact (see security.txt)
      url: https://xguardgate.com/security
    x-apievangelist-note: contact and termsOfService added from the published /terms and /security pages; the provider-hosted
      spec declares neither.
- target: $
  update:
    externalDocs:
      description: XGuard developer quickstart
      url: https://xguardgate.com/developers
- target: $.tags
  update:
  - name: Facilitator
    description: 'x402 v2 facilitator relay: supported kinds, verify, settle, routing, discovery and receipts.'
  - name: Paid Web Fetch
    description: Compatible xguard.web.fetch single-page paid fetch, its preflight, quote and testnet twin.
  - name: Secretless Egress
    description: Operator credential custody and scoped agent capabilities for credential-backed upstream calls.
  - name: Action Rail
    description: Mandate-bound single-use action permits and controlled execution.
  - name: Edge
    description: DNS-authorized merchant transaction proxy.
  - name: Transaction Safety
    description: Free ATS-100 agent transaction safety test and inspection.
  - name: ProofRail
    description: Signed execution-evidence discovery and verification.
  - name: Health
    description: Liveness, readiness, payment readiness, metrics and protocol discovery.
  - name: Discovery
    description: Canonical discovery aliases and OAuth protected-resource metadata.
- target: $.components
  update:
    securitySchemes:
      XGuardKey:
        type: apiKey
        in: header
        name: X-XGuard-Key
        description: Operator management key. Required on Secretless Egress credential/capability management and
          Action Rail permits (401 xguard_key_required when absent). Documented in the ai-plugin manifest auth block
          and docs/secretless-outcomes.md.
      PaymentSignature:
        type: apiKey
        in: header
        name: Payment-Signature
        description: x402 v2 signed payment for the retry of a request that answered HTTP 402 with Payment-Required.
          Not an account credential.
      XGuardQuote:
        type: apiKey
        in: header
        name: X-XGuard-Quote
        description: Signed five-minute price quote (ES256 JWS) returned in the 402; must be preserved on the paid
          retry and is the bearer recovery credential for GET /v1/results/{payment_identifier}.
      XGuardCredit:
        type: apiKey
        in: header
        name: X-XGuard-Credit
        description: Signed execution credit issued when every source fails after settlement; redeems one re-execution
          of the same outcome without a second payment.
