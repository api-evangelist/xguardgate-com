    host mirroring the core set: RFC 9116 security.txt (Contact, Expires 2027-08-27, two Canonical URLs,
    Policy, Preferred-Languages en/ar), RFC 9728 oauth-protected-resource for both the API resource and the MCP
    resource (each stating bearer_methods_supported [] and oauth_supported false - "public and pay-per-request
    tools do not require an XGuard account or OAuth bearer token"), an OpenAI ai-plugin.json manifest, an A2A
    agent card at both the 1.0 and legacy paths, an x402 facilitator discovery document (/.well-known/x402),
    a payment manifest, egress / actions manifests with their signing keys, the ProofRail verification key
    (ES256 JWK, kid did:web:api.xguardgate.com#xguard-proofrail), an MCP server card (also at
    /.well-known/xguard-tools.json) and an agent-directory index. What it does NOT publish: OpenID
    configuration, an OAuth authorization-server document (a deliberate JSON 404 saying "XGuard does not
    advertise a fictitious OAuth issuer"), an RFC 9727 api-catalog, an APIs.json index, an AAuth resource
    document, or UCP/ACP manifests. Every miss is the site's real JSON 404 envelope (374 bytes, code not_found)
    - never an HTML shell - and the negative-control path also 404s on every host, so each 200 is a served
    document. www.xguardgate.com 308s every path to the apex and serves nothing of its own;
    reconcile.xguardgate.com serves only its x402 discovery document and a robots.txt.
